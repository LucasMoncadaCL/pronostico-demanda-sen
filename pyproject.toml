[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "demanda-sen-pronostico"
version = "0.1.0"
description = "Investigación reproducible y pronóstico horario de demanda sistémica agregada del SEN de Chile."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
eda = [
    "jupyterlab>=4.2,<5",
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "matplotlib>=3.8,<4",
]
modeling = [
    "jupyterlab>=4.2,<5",
    "pandas>=2.2,<4",
    "numpy>=2.0,<3",
    "matplotlib>=3.8,<4",
    "scikit-learn==1.9.0",
]
dashboard = [
    "pandas>=2.2,<4",
    "plotly>=6.0,<7",
    "streamlit>=1.50,<2",
]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
